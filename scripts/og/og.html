<!doctype html>
<!-- Template for public/og.png (1200x630 social link preview). Rendered by scripts/og/render.mjs.
     bg.png is a real frame captured from the running app's route fly-through, tunnel section. -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: 'Barlow'; font-weight: 600; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 800; src: url('../../node_modules/@fontsource/barlow/files/barlow-latin-800-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0d10; }
  .card { position: relative; width: 1200px; height: 630px; font-family: 'Barlow', system-ui, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; background: url('bg.png') center / cover no-repeat; }
  .shade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(8,10,14,0.94) 0%, rgba(8,10,14,0.9) 38%, rgba(8,10,14,0.62) 56%, rgba(8,10,14,0) 78%);
  }
  /* Safe area: everything stays 60px in from each edge. */
  .safe { position: absolute; left: 60px; top: 60px; right: 60px; bottom: 60px; display: flex; flex-direction: column; justify-content: center; }
  .logo { width: 120px; height: 120px; display: block; }
  h1 { margin-top: 26px; font-size: 96px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .tag { margin-top: 16px; width: 590px; font-size: 40px; font-weight: 600; line-height: 1.2; }
  .url { margin-top: 24px; font-size: 32px; font-weight: 800; line-height: 1; color: #FFD54F; }
</style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="shade"></div>
    <div class="safe">
      <img class="logo" src="../../public/logo.png" alt="" />
      <h1>ThruLoo</h1>
      <p class="tag">Find any room at UW,<br />even through the tunnels</p>
      <p class="url">thruloo.dylanrolfe.ca</p>
    </div>
  </div>
</body>
</html>
